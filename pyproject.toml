[project]
name = "saucedemo"
version = "0.1.0"
description = "KISS Playwright + pytest POM for saucedemo.com"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "allure-pytest>=2.15",
    "faker>=40.39.0",
    "pytest>=8.3",
    "pytest-playwright>=0.6",
    "python-dotenv>=1.2.3",
]

[tool.black]
line-length = 88
target-version = ["py311"]

# UV uses this file as the single source of truth for deps.
# Students: `uv sync` then `uv run pytest` — no pip / venv dance.

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `from pages.login_page import LoginPage` works without installing the package.
pythonpath = ["."]
addopts = [
    "-v",
    "--browser=chromium",
    "--base-url=https://www.saucedemo.com",
    "--screenshot=only-on-failure",
    "--output=artifacts",
    "--alluredir=allure-results",
    "--clean-alluredir",
]
# Logs: pytest writes every `logging` call to logs/test_run.log (overwritten each run).
# INFO by default. More detail: uv run pytest --log-file-level=DEBUG
log_file = "logs/test_run.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s %(levelname)-5s %(name)s: %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
